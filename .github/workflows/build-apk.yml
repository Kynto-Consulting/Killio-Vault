name: Build Vault APK

# Builds the Killio Vault Android release APK in CI — same output as the local
# `expo prebuild` + `gradlew assembleRelease` flow. The release build falls back
# to the committed debug.keystore (android/app/build.gradle) unless the optional
# KILLIO_UPLOAD_* secrets are provided, so NO secrets are required for an
# installable APK.
#
# Triggers:
#   - Manual: Actions tab → "Build Vault APK" → Run workflow (pick a branch).
#   - Tag push `v*` (e.g. v1.2.3): builds + attaches the APK to a GitHub Release.
#
# Output: the APK is uploaded as a workflow artifact ("killio-vault-apk") and,
# on a tag, attached to the Release for a direct download URL.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'ABIs to build (arm64-v8a is the device default; "all" is slower)'
        required: false
        default: 'arm64-v8a'
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create/attach the Release on tag builds

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (regenerate android/)
        run: npx expo prebuild --platform android --no-install

      - name: Gradle build (assembleRelease)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ARCH="${{ github.event.inputs.arch || 'arm64-v8a' }}"
          if [ "$ARCH" = "all" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures="$ARCH"
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: killio-vault-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
