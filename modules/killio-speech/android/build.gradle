apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

group = 'dev.killio.speech'
version = '0.0.1'

android {
  namespace 'dev.killio.speech'
  compileSdkVersion safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 26)
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
  // Fully on-device, streaming STT. The acoustic/language model is NOT bundled in
  // the APK — it is downloaded once on first start into filesDir (see
  // VaultSpeechService.ensureModel), so this dependency adds only the small native
  // Vosk/Kaldi runtime, not the ~39MB model.
  implementation "com.alphacephei:vosk-android:0.3.47"
}
