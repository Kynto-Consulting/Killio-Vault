apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

group = 'dev.killio.speech'
version = '0.0.1'

android {
  namespace 'dev.killio.speech'
  compileSdkVersion safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 26)
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
    // The project ships arm64-v8a only — and we only vendor the arm64-v8a sherpa
    // .so (see sourceSets below), so restrict to arm64-v8a to match the
    // app-level abiFilters. (If the app ever adds armeabi-v7a, vendor those .so
    // into src/main/jniLibs/armeabi-v7a and add the ABI here too.)
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  // ── sherpa-onnx (k2-fsa, Apache-2.0) — VENDORED, not a gradle dependency ─────
  // sherpa-onnx does NOT publish a consumable Android artifact (the
  // `com.k2fsa.sherpa.onnx:sherpa-onnx` JitPack coordinate is a 404). Android is
  // distributed as a prebuilt tarball of JNI `.so` files PLUS Kotlin API SOURCE
  // that must be vendored into the consuming project. We therefore vendor:
  //   • the v1.13.2 prebuilt JNI libs  → src/main/jniLibs/arm64-v8a/*.so
  //     (libsherpa-onnx-jni.so, libonnxruntime.so, libsherpa-onnx-c-api.so,
  //      libsherpa-onnx-cxx-api.so). arm64-v8a only — matches abiFilters above.
  //   • the v1.13.2 Kotlin API source  → src/main/java/com/k2fsa/sherpa/onnx/*.kt
  //     (OnlineRecognizer, OnlineStream, Vad, SpeakerEmbeddingExtractor, …;
  //      each declares `package com.k2fsa.sherpa.onnx` and loads the JNI via
  //      `System.loadLibrary("sherpa-onnx-jni")` in its companion init).
  // The Android Gradle Plugin auto-includes src/main/jniLibs and src/main/java by
  // default; the explicit srcDirs below make that intent obvious / robust against
  // any custom sourceSet the Expo module plugin may apply.
  sourceSets {
    main {
      jniLibs.srcDirs += ['src/main/jniLibs']
      java.srcDirs += ['src/main/java']
    }
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

dependencies {
  // sherpa-onnx is vendored (see the `sourceSets`/jniLibs comment above) — no
  // external coordinate. The acoustic models are NOT bundled in the APK: they are
  // downloaded once on first start into filesDir (see VaultSpeechService).
}
